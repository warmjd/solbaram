<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1830">
<title>솔바람 마을</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-bleed pixel canvas with a thin HUD on top and thumb controls at the bottom corners. */
:root{
  --ink:#1b1830; --panel:#2a2543; --line:#4d4673; --text:#f4effd; --mute:#b6add6;
  --hp:#ef5b6b; --xp:#f2c14e; --go:#7be0a4; --gold:#ffd166;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
input,button{font-family:inherit}
input{-webkit-user-select:text;user-select:text}
body{background:var(--ink);color:var(--text);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}

#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:10px max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.card{background:rgba(27,24,48,.82);border:2px solid var(--line);border-radius:8px;padding:6px 10px;min-width:140px;max-width:46vw}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;line-height:1.2}
.row span{color:var(--mute);font-size:13px}
.bar{position:relative;height:12px;margin-top:5px;background:#120f22;border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--hp);transition:width .15s}
.bar.xp{height:6px}
.bar.xp i{background:var(--xp);width:0}
.bar span{position:relative;display:block;font-size:10px;line-height:12px;text-align:center;color:#fff;text-shadow:0 1px 0 #0008}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{background:rgba(27,24,48,.82);border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.coin{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #c9962b}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;background:#3b3560}
.dots i.on{background:var(--go)}

#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:26px;letter-spacing:.04em;
  text-shadow:0 2px 0 #000a,0 0 12px #000a;opacity:0;pointer-events:none}
#banner.show{animation:bn 2.4s ease-out}
@keyframes bn{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

#log{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:134px;display:flex;flex-direction:column;gap:2px;pointer-events:none;
  font-size:13px;text-shadow:0 1px 0 #000c;max-width:64vw}
#log div{background:rgba(27,24,48,.6);padding:1px 6px;border-radius:4px;width:fit-content}

#stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:26px;width:124px;height:124px;border-radius:50%;
  background:rgba(244,239,253,.08);border:2px solid rgba(244,239,253,.22)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:rgba(244,239,253,.28);border:2px solid rgba(244,239,253,.5);pointer-events:none}
#btns{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:22px;width:190px;height:170px}
.b{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.55);color:#fff;font-family:var(--display);
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;touch-action:none;cursor:pointer}
.b small{display:block;font-size:11px;opacity:.85}
.b.on{filter:brightness(.7)}
#bA{right:0;bottom:0;width:88px;height:88px;font-size:20px;background:#d65a5a}
#bS{right:98px;bottom:12px;width:62px;height:62px;font-size:15px;background:#6d64d6}
#bP{right:30px;bottom:100px;width:56px;height:56px;font-size:14px;background:#3d9b6b}
.b.cd{opacity:.5}

#pick{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:20px max(16px,env(safe-area-inset-left,0px));background:rgba(20,17,38,.9)}
#pick[hidden]{display:none}
#pick h1{margin:0;font-size:30px;font-weight:400;text-wrap:balance;text-align:center}
#pick p{margin:0;color:var(--mute);font-size:14px;text-align:center}
.cls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:520px}
.cls button{font-family:var(--display);color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:10px;
  width:140px;padding:12px 8px;font-size:18px;cursor:pointer}
.cls button:hover,.cls button:focus-visible{border-color:var(--go);outline:none}
.cls button small{display:block;margin-top:4px;color:var(--mute);font-size:12px}
.cls .sw{width:22px;height:22px;border-radius:5px;margin:0 auto 6px}
.gear{margin-top:5px;font-size:11px;line-height:1.35;display:flex;flex-wrap:wrap;gap:0 8px}
.gear b{font-weight:400}
.btn{pointer-events:auto;cursor:pointer;color:var(--text);font-size:14px}
.btn:active{filter:brightness(.8)}
.ns{width:8px;height:8px;border-radius:50%;background:var(--hp);display:inline-block}
.ns.ok{background:var(--go)}
#boss{position:absolute;top:100px;left:50%;transform:translateX(-50%);width:min(240px,60vw);text-align:center;font-size:13px;text-shadow:0 1px 0 #000a;pointer-events:none}
#boss .bar{height:10px;margin-top:3px;border:2px solid var(--line)}
#boss .bar i{background:#b06be0}
#chatbar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:104px;z-index:5;display:flex;flex-direction:column;gap:6px;padding:8px;background:rgba(27,24,48,.95);border:2px solid var(--line);border-radius:10px;max-width:420px}
#chatbar .r{display:flex;gap:6px}
#chatin,#nick{flex:1;min-width:0;background:#120f22;color:var(--text);border:2px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px}
#nick{flex:none;width:min(260px,80vw);text-align:center}
.sb{font-family:var(--display);color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 12px;font-size:15px;cursor:pointer}
.sb:disabled{opacity:.45;cursor:default}
.sb:hover:not(:disabled),.sb:focus-visible{border-color:var(--go);outline:none}
.sb small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.sb.ghost{background:transparent}
.qs{display:flex;flex-wrap:wrap;gap:6px}
.qs .sb{padding:5px 9px;font-size:13px}
#shop{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-left,0px));background:rgba(20,17,38,.72)}
.sp{width:min(340px,100%);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sp h2{margin:0;font-size:20px;font-weight:400}
.sgold{color:var(--mute);font-size:14px}
</style></head><body>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="card">
      <div class="row"><b id="lv">Lv.1</b><span id="cn"></span></div>
      <div class="bar"><i id="hpb"></i><span id="hpt"></span></div>
      <div class="bar xp"><i id="xpb"></i></div>
      <div class="gear" id="gear"></div>
    </div>
    <div class="side">
      <div class="chip"><span class="coin"></span><b id="gl">0</b></div>
      <div class="chip"><span class="ns" id="netst" hidden></span>파티 <span class="dots" id="dots"><i class="on"></i><i></i><i></i></span></div>
      <button class="chip btn" id="chatBtn" type="button">대화</button>
      <button class="chip btn" id="shopBtn" type="button" hidden>상점</button>
    </div>
  </div>
  <div id="boss" hidden><span>늑대왕</span><div class="bar"><i id="bossb"></i></div></div>
  <div id="chatbar" hidden>
    <div class="r"><input id="chatin" maxlength="40" placeholder="메시지 (40자)" autocomplete="off"><button class="sb" id="chatgo" type="button">보내기</button></div>
    <div class="qs"><button class="sb q" type="button">안녕!</button><button class="sb q" type="button">도와줘!</button><button class="sb q" type="button">고마워!</button><button class="sb q" type="button">ㅋㅋㅋ</button><button class="sb q" type="button">보스 가자!</button></div>
  </div>
  <div id="shop" hidden>
    <div class="sp">
      <h2>마을 상점</h2>
      <div class="sgold">보유 <b id="shg">0</b> 글로드</div>
      <button class="sb" id="shP" type="button"></button>
      <button class="sb" id="shW" type="button"></button>
      <button class="sb" id="shA" type="button"></button>
      <button class="sb ghost" id="shR" type="button">새 캐릭터로 시작</button>
      <button class="sb ghost" id="shX" type="button">닫기</button>
    </div>
  </div>
  <div id="banner"></div>
  <div id="log"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <div class="b" id="bP">물약<small id="pn">5</small></div>
    <div class="b" id="bS">스킬<small id="sn"></small></div>
    <div class="b" id="bA">공격</div>
  </div>
  <div id="pick" hidden>
    <h1>솔바람 마을에 어서 와요</h1>
    <p>이름을 적고 직업을 골라 시작하세요. 이동은 왼쪽 조이스틱, 공격은 오른쪽 버튼입니다.</p>
    <input id="nick" maxlength="8" placeholder="이름 (최대 8자)" autocomplete="off">
    <div class="cls" id="clsrow"></div>
    <p id="roomtxt"></p>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const T=16, MW=56, MH=34, W=MW*T, H=MH*T;

/* ---------- classes ---------- */
const CLS={
  warrior:{name:'전사',col:'#d65a5a',hair:'#9aa3b8',hp:120,atk:9,cd:.38,skcd:4,sk:'회전베기',desc:'근접 · 튼튼함'},
  mage:{name:'마법사',col:'#6d64d6',hair:'#e9c46a',hp:80,atk:12,cd:.55,skcd:3.5,sk:'화염폭발',desc:'원거리 · 강한 한 방'},
  cleric:{name:'성직자',col:'#f3ecff',hair:'#b8794a',hp:100,atk:6,cd:.4,skcd:6,sk:'성스러운 빛',desc:'회복 · 버티기'}
};
const MON={
  slime:{name:'슬라임',hp:24,dmg:4,exp:7,gl:[3,9],sp:22,col:'#5fd38d',dk:'#2f9b62'},
  wolf:{name:'회색늑대',hp:70,dmg:9,exp:22,gl:[10,28],sp:38,col:'#9aa0ad',dk:'#5f6574'}
};
const ZONES=['솔바람 마을','초록 들판','회색 늑대숲','늑대왕의 둥지'];
MON.king={name:'늑대왕',hp:900,dmg:16,exp:140,gl:[200,400],sp:44,col:'#6b5b86',dk:'#3d3354'};
const TI={slime:0,wolf:1,king:2}, TN=['slime','wolf','king'], SLAM_R=44;
const DV=[[0,1],[-1,0],[1,0],[0,-1]];
const needExp=l=>Math.round(18+l*l*9+l*12);

/* ---------- map ---------- */
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const solids=[], props=[];
const gc=document.createElement('canvas'); gc.width=W; gc.height=H; const g=gc.getContext('2d');
function drawTree(c,x,y){
  c.fillStyle='rgba(0,0,0,.2)'; c.fillRect(x-6,y-2,12,3);
  c.fillStyle='#6b4a32'; c.fillRect(x-1,y-8,3,8);
  c.fillStyle='#2f7d4f'; c.fillRect(x-7,y-20,14,12); c.fillRect(x-5,y-23,10,3);
  c.fillStyle='#3f9a60'; c.fillRect(x-5,y-21,6,5);
  c.fillStyle='#276a43'; c.fillRect(x+1,y-14,6,5);
}
function addTree(tx,ty,solid){
  const x=tx*T+8, y=ty*T+14;
  if(solid) solids.push({x:x-4,y:y-5,w:8,h:5});
  props.push({y,draw:c=>drawTree(c,x,y),x});
}
function drawHouse(c,h){
  const x=h.tx*T, y=h.ty*T, w=h.w*T, ht=h.h*T;
  c.fillStyle='rgba(0,0,0,.2)'; c.fillRect(x+2,y+ht-3,w,5);
  c.fillStyle='#cfc4b2'; c.fillRect(x,y+24,w,ht-24);
  c.fillStyle='#b8ac98'; c.fillRect(x,y+ht-6,w,6);
  c.fillStyle=h.roof; c.fillRect(x-4,y+4,w+8,22); c.fillRect(x+4,y,w-8,6);
  c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(x-4,y+20,w+8,6);
  c.fillStyle='rgba(255,255,255,.18)'; for(let i=0;i<w;i+=8) c.fillRect(x+i,y+8,4,3);
  c.fillStyle='#6b4a32'; const dx=x+w/2-5; c.fillRect(dx,y+ht-16,10,16);
  c.fillStyle='#ffd166'; c.fillRect(dx+7,y+ht-9,2,2);
  c.fillStyle='#7ec3e8'; c.fillRect(x+6,y+30,8,8); if(w>60) c.fillRect(x+w-14,y+30,8,8);
}
const houses=[{tx:1,ty:3,w:5,h:4,roof:'#c0504f'},{tx:8,ty:3,w:5,h:4,roof:'#4f7fc0'},{tx:2,ty:24,w:5,h:4,roof:'#7a5fc0'}];
function buildMap(){
  seed=11;
  g.fillStyle='#78bf66'; g.fillRect(0,0,W,H);
  const gs=['#6fb35e','#84c871','#6aa95a','#8ad07a'];
  for(let i=0;i<5200;i++){ g.fillStyle=gs[(rnd()*4)|0]; g.fillRect((rnd()*W)|0,(rnd()*H)|0,2,1); }
  g.fillStyle='rgba(18,70,70,.22)'; g.fillRect(36*T,0,W-36*T,H);
  g.fillStyle='#d8bb82'; g.fillRect(0,16*T,W,2*T);
  g.fillStyle='#c9aa72'; for(let i=0;i<700;i++) g.fillRect((rnd()*W)|0,16*T+((rnd()*32)|0),2,1);
  g.fillStyle='#d8bb82'; g.fillRect(4*T,13*T,8*T,8*T);
  g.fillStyle='#c9aa72'; for(let i=0;i<200;i++) g.fillRect(4*T+((rnd()*128)|0),13*T+((rnd()*128)|0),2,2);
  g.fillStyle='#4aa3d8'; g.fillRect(9*T,21*T,4*T,3*T);
  g.fillStyle='#7cc9ee'; for(let i=0;i<10;i++) g.fillRect(9*T+4+((rnd()*52)|0),21*T+4+((rnd()*38)|0),6,1);
  g.fillStyle='#2d7fb0'; g.fillRect(9*T,21*T,4*T,2); g.fillRect(9*T,24*T-2,4*T,2);
  solids.push({x:9*T,y:21*T,w:4*T,h:3*T});
  g.fillStyle='#6d5f7a'; g.fillRect(46*T,9*T,9*T,16*T);
  g.fillStyle='#5b4e68'; for(let i=0;i<500;i++) g.fillRect(46*T+((rnd()*144)|0),9*T+((rnd()*256)|0),2,2);
  g.fillStyle='#82738f'; for(let i=0;i<260;i++) g.fillRect(46*T+((rnd()*144)|0),9*T+((rnd()*256)|0),2,1);
  const fl=['#ff8fb1','#ffe066','#ffffff','#b79cff'];
  for(let i=0;i<150;i++){ const x=(rnd()*W)|0,y=(rnd()*H)|0; if(y>16*T-2&&y<18*T+2) continue; g.fillStyle=fl[(rnd()*4)|0]; g.fillRect(x,y,2,2); g.fillStyle='#4f9a45'; g.fillRect(x,y+2,1,2); }
  houses.forEach(h=>{
    solids.push({x:h.tx*T,y:h.ty*T+10,w:h.w*T,h:h.h*T-10});
    props.push({y:(h.ty+h.h)*T,x:h.tx*T,draw:c=>drawHouse(c,h)});
  });
  for(let ty=2;ty<MH-1;ty++){
    if(ty>=15&&ty<=18) continue;
    solids.push({x:14*T+6,y:ty*T,w:4,h:T});
    const cx=14*T+8, by=ty*T+T;
    props.push({y:by,x:cx,draw:c=>{ c.fillStyle='#8a6a43'; c.fillRect(cx-1,ty*T,3,T); c.fillStyle='#b08a58'; c.fillRect(cx-2,ty*T+5,5,4); }});
  }
  for(let tx=0;tx<MW;tx++){ addTree(tx,0,false); addTree(tx,MH-1,false); }
  for(let ty=1;ty<MH-1;ty++){ addTree(0,ty,false); addTree(MW-1,ty,false); }
  const used=new Set();
  for(let i=0;i<260;i++){
    const tx=15+((rnd()*(MW-17))|0), ty=2+((rnd()*(MH-4))|0);
    if(ty>=15&&ty<=18) continue; if(tx>=45&&ty>=8&&ty<=26) continue; if(used.has(tx+','+ty)) continue; used.add(tx+','+ty);
    addTree(tx,ty,true);
  }
  for(let i=0;i<40;i++){
    const tx=1+((rnd()*12)|0), ty=1+((rnd()*(MH-2))|0);
    if(tx>=1&&tx<=13&&((ty>=3&&ty<=7)||(ty>=12&&ty<=22)||(ty>=24&&ty<=28))) continue;
    if(used.has(tx+','+ty)) continue; used.add(tx+','+ty); addTree(tx,ty,true);
  }
  props.sort((a,b)=>a.y-b.y);
}
buildMap();
function blocked(x,y,r){
  if(x<14||x>W-14||y<30||y>H-12) return true;
  for(const s of solids){ if(x+r>s.x&&x-r<s.x+s.w&&y+r>s.y&&y-r<s.y+s.h) return true; }
  return false;
}
function tryMove(o,dx,dy,r){
  if(!blocked(o.x+dx,o.y,r)) o.x+=dx;
  if(!blocked(o.x,o.y+dy,r)) o.y+=dy;
}

/* ---------- sprites ---------- */
function drawChar(c,x,y,dir,fr,cls,flash,robe){
  x=Math.round(x); y=Math.round(y);
  c.fillStyle='rgba(0,0,0,.25)'; c.fillRect(x-5,y-1,10,3);
  c.fillStyle='#4a3b52'; c.fillRect(x-3,y-3,2,fr?3:2); c.fillRect(x+1,y-3,2,fr?2:3);
  const col=robe||cls.col;
  c.fillStyle=col; c.fillRect(x-4,y-9,8,6);
  c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(x-4,y-5,8,1);
  c.fillStyle='rgba(0,0,0,.12)'; c.fillRect(x-5,y-9,1,5); c.fillRect(x+4,y-9,1,5);
  c.fillStyle='#f6d3b0'; c.fillRect(x-5,y-17,10,8);
  c.fillStyle=robe?'#4a3a2a':cls.hair; c.fillRect(x-5,y-18,10,dir===3?9:4);
  if(dir!==3){ c.fillRect(x-5,y-14,1,3); c.fillRect(x+4,y-14,1,3); }
  c.fillStyle='#2a2036';
  if(dir===0){ c.fillRect(x-3,y-13,2,2); c.fillRect(x+1,y-13,2,2); c.fillStyle='#f29aa8'; c.fillRect(x-4,y-11,1,1); c.fillRect(x+3,y-11,1,1); }
  else if(dir===1) c.fillRect(x-4,y-13,2,2);
  else if(dir===2) c.fillRect(x+2,y-13,2,2);
  if(!robe){
    if(cls===CLS.warrior){ c.fillStyle='#c9d1e0'; c.fillRect(x+5,y-13,1,9); c.fillStyle='#8a6a43'; c.fillRect(x+4,y-5,3,1); }
    else if(cls===CLS.mage){ c.fillStyle='#4a40a8'; c.fillRect(x-6,y-18,12,2); c.fillRect(x-3,y-23,6,5); c.fillRect(x-1,y-26,3,3); }
    else { c.fillStyle='#ffd166'; c.fillRect(x-4,y-21,8,1); c.fillStyle='#8a6a43'; c.fillRect(x-6,y-14,1,11); c.fillStyle='#ffd166'; c.fillRect(x-7,y-16,3,2); }
  }
  if(flash>0){ c.fillStyle='rgba(255,255,255,.55)'; c.fillRect(x-5,y-18,10,17); }
}
function drawKing(c,m){

function dmgRoll(mult){ let d=P.atk*mult*(.85+rnd()*.3), crit=rnd()<.1; if(crit) d*=1.6; return {d:Math.max(1,Math.round(d)),crit}; }
function hitMon(m,mult,kx,ky){
  const r=dmgRoll(mult);
  floatText(m.x,m.y-16,String(r.d),r.crit?'#ffd166':'#ffffff');
  if(!amHost()){
    m.flash=.12;
    if(room) room.emit('hit',{id:m.id,d:r.d,kx:Math.sign(kx),ky:Math.sign(ky)}).catch(()=>{});
    return;
  }
  applyHit(m,r.d,kx,ky,myPeer);
}
function applyHit(m,d,kx,ky,by){
  m.hp-=d; m.flash=.12; m.kx=kx*70; m.ky=ky*70; m.aggro=true;
  if(m.hp<=0) killMon(m,by);
}
function killMon(m,killer){
  const i=mons.indexOf(m); if(i<0) return; mons.splice(i,1);
  if(m.type==='king') bossCd=90;
  const gl=m.t.gl[0]+((rnd()*(m.t.gl[1]-m.t.gl[0]+1))|0);
  const mine=!room||!killer||killer===myPeer;
  if(room) room.emit('kill',{t:m.type,x:Math.round(m.x),y:Math.round(m.y),gl,kp:killer||myPeer}).catch(()=>{});
  reward(m.type,m.x,m.y,gl,mine);
}
function reward(type,mx,my,gl,mine){

  floatText(mx,my-24,'+'+t.exp+' EXP','#f2c14e');
  say(t.name+' 처치'+(mine?'  +'+gl+' 글로드':''));

  if(type==='king') say('늑대왕을 쓰러뜨렸어요!');
  rollDrop(type);
  let lu=false;
  while(P.exp>=needExp(P.lv)){ P.exp-=needExp(P.lv); P.lv++; lu=true; }
  if(lu){ recalc(); P.hp=P.maxhp; fx.push({type:'ring',x:P.x,y:P.y-6,r:30,t:0,d:.7,col:'#ffd166'}); say('레벨 업! Lv.'+P.lv); floatText(P.x,P.y-30,'LEVEL UP','#ffd166'); if(P.lv===5) say('수호동물이 자랐어요!'); }

/* ---------- spawn / update ---------- */
function makeMon(id,type,x,y){
  const t=MON[type]; return {id,type,t,x,y,tx:x,ty:y,hp:t.hp,max:t.hp,ph:rnd()*6,fx:1,flash:0,kx:0,ky:0,wx:0,wy:0,wt:0,atk:0,aggro:false};
}
function targets(){
  const a=[]; if(P&&P.x>=14*T) a.push({x:P.x,y:P.y,me:true});
  remotes.forEach(r=>{ if(r.x>=14*T) a.push({x:r.x,y:r.y,peer:r.peer}); });
  return a;
}
function amHost(){
  if(!room) return true;
  if(time-startedAt<2) return false;
  return remotes.size===0||hostPeer===myPeer;
}
function spawnBoss(){
  const n=1+remotes.size, m=makeMon(nid++,'king',51*T,21*T);
  m.hp=m.max=Math.round(MON.king.hp*(1+.7*(n-1))); mons.push(m);
  say('늑대왕이 둥지에 나타났어요! 동쪽으로 모여요');
}
function spawnMon(){
  const tg=targets();
  for(let i=0;i<20;i++){
    const x=16*T+rnd()*(29*T), y=36+rnd()*(H-56);
    if(blocked(x,y,6)) continue;
    let near=false; for(const q of tg) if(Math.hypot(x-q.x,y-q.y)<100) near=true;
    if(near) continue;
    mons.push(makeMon(nid++,(x>34*T&&rnd()<.65)?'wolf':'slime',x,y));
    return;
  }
}
function pHurt(q,d){ if(q.me) hurt(d); else if(room) room.emit('phit',{to:q.peer,d}).catch(()=>{}); }
function kingAI(m,dt,tg){
  m.kx=0; m.ky=0; m.sc=(m.sc||0)-dt;
  let tgt=null, d=1e9;
  for(const q of tg){ const dd=Math.hypot(q.x-m.x,q.y-m.y); if(dd<d){ d=dd; tgt=q; } }
  if(m.slT>0){
    m.slT-=dt;
    if(m.slT<=0){
      m.slT=0; fx.push({type:'ring',x:m.x,y:m.y-4,r:SLAM_R,t:0,d:.4,col:'#ff6b6b',fill:true});
      for(const q of tg) if(Math.hypot(q.x-m.x,q.y-m.y)<SLAM_R) pHurt(q,22);
    }
    return;
  }
  if(!tgt||(d>=240&&!m.aggro)) return;
  const dx=tgt.x-m.x, dy=tgt.y-m.y;
  if(Math.abs(dx)>2) m.fx=dx;
  if(d>16) tryMove(m,dx/d*m.t.sp*dt,dy/d*m.t.sp*dt,8);
  if(m.x<44*T) m.x=44*T;
  if(d<SLAM_R-8&&m.sc<=0){ m.slT=1; m.sc=4.5; }
  else if(d<=18&&m.atk<=0){ m.atk=1.3; pHurt(tgt,m.t.dmg); }
}
function update(dt){
  time+=dt;
  if(!started) return;
  let ix=stick.x, iy=stick.y;
  if(keys.has('arrowleft')||keys.has('a')) ix-=1;

}

const ROOM=(new URLSearchParams(location.search).get('room')||'main').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,24)||'main';
function makeRoom(){
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+encodeURIComponent(ROOM);
  let ws=null, open=false, me=null, retry=0, stop=false, pres={};
  const peers=new Map(), topics=new Map(), phs=new Set(), chs=new Set();
  const mkPeer=(id,p)=>({peer:id,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:p||{},updatedAt:Date.now()});
  const snap=()=>{ const a=[]; if(me) a.push({peer:me,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:pres,updatedAt:Date.now()}); peers.forEach(p=>a.push(p)); return a; };
  const fire=()=>{ const sn=snap(); phs.forEach(h=>{ try{ h({peers:sn,joined:[],left:[],updated:[]}); }catch(e){} }); };
  const tx=o=>{ if(open&&ws&&ws.readyState===1) ws.send(JSON.stringify(o)); };
  function connect(){
    if(stop) return;
    ws=new WebSocket(url);
    ws.onopen=()=>{ open=true; retry=0; chs.forEach(h=>h(true)); };
    ws.onmessage=ev=>{
      let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      if(!m||typeof m!=='object') return;
      if(m.t==='hello'){
        me=String(m.peer); peers.clear();
        (m.peers||[]).forEach(p=>peers.set(p.peer,mkPeer(p.peer,p.presence)));
        if(Object.keys(pres).length) tx({t:'p',patch:pres});
        fire();
      } else if(m.t==='leave'){ if(peers.delete(m.peer)) fire(); }
      else if(m.t==='p'&&m.patch&&typeof m.patch==='object'){
        const old=peers.get(m.peer), np={...(old?old.presence:{})};
        for(const k in m.patch){ if(m.patch[k]===null) delete np[k]; else np[k]=m.patch[k]; }
        peers.set(m.peer,{...(old||mkPeer(m.peer)),presence:np,updatedAt:Date.now()}); fire();
      } else if(m.t==='e'){
        const set=topics.get(m.topic); if(!set) return;
        const msg={topic:m.topic,peer:m.peer,data:m.data,isMe:false,sameTab:false,kind:'viewer',guest:false,by:null};
        set.forEach(fn=>{ try{ fn(msg); }catch(e){} });
      } else if(m.t==='full'){ stop=true; say('방이 가득 찼어요 (최대 6명). 다른 방 코드를 써보세요.'); }
    };
    ws.onclose=()=>{ const was=open; open=false; peers.clear(); me=null; if(was) chs.forEach(h=>h(false)); fire(); if(!stop) setTimeout(connect,Math.min(5000,400*(++retry))); };
    ws.onerror=()=>{ try{ ws.close(); }catch(e){} };
  }
  return {
    connect,
    emit:(topic,data)=>{ tx({t:'e',topic,data}); return Promise.resolve(); },
    on:(topic,fn)=>{ if(!topics.has(topic)) topics.set(topic,new Set()); topics.get(topic).add(fn); return ()=>topics.get(topic).delete(fn); },
    presence:patch=>{ pres={...pres}; for(const k in patch){ if(patch[k]===null) delete pres[k]; else pres[k]=patch[k]; } tx({t:'p',patch}); return Promise.resolve(); },
    onPeers:fn=>{ phs.add(fn); return ()=>phs.delete(fn); },
    onConnection:fn=>{ chs.add(fn); return ()=>chs.delete(fn); }
  };
}
function initNet(){

  room.onConnection(c=>{ netOk=c; say(c?'서버에 연결됐어요 (방: '+ROOM+')':'연결이 끊겼어요. 다시 연결하는 중…'); });
  room.connect();
}
